      parameters:
      - name: "research_id"
        in: "path"
        description: De unieke ID van het onderzoek
        required: true
        type: "string"
      - name: "body"
        in: "body"
        description: "Gegevens om aan te passen met de nieuwe waarden"
        required: true
        schema:
          type: "object"
          required:
            - title
            - available
            - description
            - start_date
            - end_date
            - with_reward
            - reward
          properties:
            description:
              type: "string"
              example: "string"
            end_date:
              type: "string"
              example: "string"
              format: date
            reward:
              type: "string"
              example: "string"
            start_date:
              type: "string"
              example: "string"
              format: date
            title:
              type: "string"
              example: "string"
            with_reward:
              type: "integer"
              example: 0
              enum: [0, 1]
      responses:
        200:
          description: "Onderzoekgegevens succesvol aangepast"
          schema:
            $ref: "#/definitions/ApiResponseInteger"
        401:
          description: "Geen JWT gevonden in cookies of headers, zonder authorisatie geen toegang"
        403:
          description: "Niet toegestaan om de gegevens van dit onderzoek aan te passen"
      security:
        - jwt_auth: []

    delete:
