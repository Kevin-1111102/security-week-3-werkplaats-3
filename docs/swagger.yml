        - jwt_auth: []

  /api/subscriptions/{research_id}:
    delete:
      tags:
        - "Subscriptions"
      summary: "Verwerkt de onderzoeksafmelding van een gebruiker"
      description: "Verwerkt de onderzoeksafmelding van een gebruiker"
      parameters:
      - name: "research_id"
        in: "path"
        description: "De unieke ID van het onderzoek"
        required: true
        type: "string"
      responses:
        200:
          description: "Onderzoeksafmelding succesvol verwerkt"
          schema:
            $ref: "#/definitions/ApiResponse"
        401:
          description: "Geen JWT gevonden in cookies of headers, zonder authorisatie geen toegang"
        403:
          description: "Niet toegestaan om deze onderzoeksafmelding te verwijderen"
      security:
        - jwt_auth: []

