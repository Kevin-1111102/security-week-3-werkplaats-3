          schema:
            $ref: "#/definitions/ApiResponseInteger"
        401:
          description: "Geen JWT gevonden in cookies of headers, zonder authorisatie geen toegang"
        403:
          description: "Niet toegestaan om de gegevens van een andere organisatie te verwijderen"
      security:
        - jwt_auth: []

  /api/researches:
    get:
      tags:
        - "Researches"
      summary: "Geeft een lijst van alle onderzoeken"
      description: "Geeft een lijst van alle onderzoeken met betrekking tot de optionele zoekterm en rol van degene die een request maakt."
