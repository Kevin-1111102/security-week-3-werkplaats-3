            $ref: "#/definitions/CreateResearch"
      responses:
        200:
          description: "Onderzoek aangemaakt"
          schema:
            $ref: "#/definitions/ApiResponseInteger"
        401:
          description: "Geen JWT gevonden in cookies of headers, zonder authorisatie geen toegang"
        403:
          description: "U kunt geen onderzoeken aanmaken"
        500:
          description: "Onderzoek aanmaken mislukt"
      security:
