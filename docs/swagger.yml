        required: true
        type: "string"
      - name: "body"
        in: "body"
        description: "Alleen de status van een organisatie"
        required: true
        schema:
          type: "object"
          required:
              - status
          properties:
            status:
              type: "string"
              example: "string"
              enum: ["Nieuw", "Goedgekeurd", "Afgekeurd"]
              description: "Status van een organisatie"
      responses:
