          description: "Organisatiegegevens succesvol opgehaald"
          schema:
            type: "object"
            properties:
              data:
                type: "object"
                example: "#/definitions/GetOrganisation"
              message:
                type: "string"
                example: "string"
              success:
                type: "boolean"
                example: true
        401:
          description: "Geen JWT gevonden in cookies of headers, zonder authorisatie geen toegang"
        403:
          description: "Geen toegang tot deze informatie"
        404:
          description: "Organisatie niet gevonden"
      security:
        - jwt_auth: []

    put:
      tags:
        - "Organizations"
      summary: "Past gegevens aan van de organisatie met de opgegeven organization_id"
      description: "Past gegevens aan van de organisatie met de opgegeven organization_id."
      parameters:
      - name: "organization_id"
        in: "path"
        description: De unieke ID van de organisatie
        required: true
