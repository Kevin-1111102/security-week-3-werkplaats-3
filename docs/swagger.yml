      summary: "Gebruik om alleen de status van de organisatie met de opgegeven organization_id aan te passen"
      description: "Gebruik om alleen de status van de organisatie met de opgegeven organization_id aan te passen"
      parameters:
      - name: "organization_id"
        in: "path"
