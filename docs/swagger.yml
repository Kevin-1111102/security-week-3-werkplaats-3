        description: "De unieke ID van het onderzoek"
        required: true
        type: "string"
      responses:
        200:
          description: "Onderzoek succesvol verwijderd"
          schema:
            $ref: "#/definitions/ApiResponse"
        401:
          description: "Geen JWT gevonden in cookies of headers, zonder authorisatie geen toegang"
        403:
          description: "Niet toegestaan om dit onderzoek te verwijderen"
      security:
        - jwt_auth: []

