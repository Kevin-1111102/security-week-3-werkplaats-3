<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.png" />
    <link rel="stylesheet" href="/static/styles/styles.css" />
    <link rel="stylesheet" href="/static/styles/components/navbar.css">
    <link rel="stylesheet" href="/static/styles/components/toast.css">
    {% block additional_css %}{% endblock %}
    {% block additional_scripts %}{% endblock %}
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body data-bs-theme="light">
    {% block body %}{% endblock %}
    {% include "components/accessibility_widget.html" %}
    <div class="toast-container position-fixed bottom-0 start-0 p-2 p-md-3 w-100 w-sm-auto" aria-live="polite"></div>
    <div class="confirm-container" aria-live="polite"></div>
    <script src="https://kit.fontawesome.com/95c99f623d.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/components/navbar.js"></script>
    <script src="/static/js/components/accessibility_widget.js" type="module"></script>
  </body>
</html>
