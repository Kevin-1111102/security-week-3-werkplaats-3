{% extends "base.html" %}
{% block additional_css %}
<link rel="stylesheet" href="/static/styles/auth/login.css">
{% endblock %}
{% block title %}Inloggen{% endblock %}
{% block body %}
<div class="container-fluid min-vh-100 d-flex flex-column justify-content-center align-items-center p-3 p-md-5">
  <main class="w-100 max-w-sm-md">
    <div class="card overflow-hidden border-0 shadow">
      <div class="row g-0">
        <div class="col-md-6 p-3 p-md-4">
          <form id="loginform" class="d-flex flex-column form-signin needs-validation w-100" novalidate>
            <div class="text-center">
              <h1 class="h1 align-self-center">Login</h1>
            </div>
            <div class="d-flex align-items-center mb-3">
              <hr class="flex-grow-1">
              <span class="px-3">Voer uw inloggegevens in</span>
              <hr class="flex-grow-1">
            </div>
            <div class="form-floating">
              <input type="email" class="form-control" id="floatingInput" name="email" placeholder="E-mailadres" autocomplete="email" required />
              <label class="input-text" for="floatingInput">E-mailadres</label>
            </div>
            <div class="form-floating">
              <input type="password" class="form-control" id="floatingPassword" name="wachtwoord" placeholder="Wachtwoord" autocomplete="current-password" required />
              <label class="input-text" for="floatingPassword">Wachtwoord</label>
            </div>
            <button class="btn btn-lg btn-primary w-100 mt-3 py-2" type="submit">
              Log in
            </button>

            <div class="text-center text-muted small mt-1">
              Heeft u nog geen account?
              <a href="{{ url_for('authorization.register_user_route') }}" class="text-decoration-none">Klik hier om te registreren</a>
            </div>
          </form>
        </div>
        <div class="col-md-6 d-none d-md-block bg-secondary position-relative">
          <img src="static/images/brooke-cagle-NoRsyXmHGpI-unsplash_m.jpg" alt="Vrouw die lacht"
            class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />
        </div>
      </div>
    </div>
  </main>
</div>
<div id="errorInfo" class="sr-only" aria-live="assertive" role="status"></div>

<script type="module" src="static/js/auth/login.js"></script>
{% endblock %}
